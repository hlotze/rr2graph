<svg width="24" height="24" viewBox="0 0 24 24"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Hexagon -->
  <polygon
    points="12,1.5 21,6.5 21,17.5 12,22.5 3,17.5 3,6.5"
    fill="none"
    stroke="#0A2A66"
    stroke-width="1.5"
    stroke-linejoin="round"/>

  <!-- Top -->
  <polygon
    points="7.5,9 12,6 16.5,9 12,11.5"
    fill="#1E88FF"/>

  <!-- Left -->
  <polygon
    points="7.5,9 12,11.5 12,17 7.5,14.5"
    fill="#C9CDD3"/>

  <!-- Right -->
  <polygon
    points="16.5,9 12,11.5 12,17 16.5,14.5"
    fill="#2F3B52"/>

</svg>