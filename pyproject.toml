[project]
name = "rr2graph"
version = "0.3.0"
description = "A lightweight health data analytics tool for monthly time-series visualization and distribution analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Hagen" }
]

dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "pyyaml",
    "openpyxl",
    "xlsxwriter"
]

classifiers = [
    # License
    "License :: OSI Approved :: MIT License",

    # Audience
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",

    # Topics
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Utilities",

    # Python versions
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/hlotze/rr2graph"
Repository = "https://github.com/hlotze/rr2graph"
Issues = "https://github.com/hlotze/rr2graph/issues"
Documentation = "https://github.com/hlotze/rr2graph#readme"
Changelog = "https://github.com/hlotze/rr2graph/releases"

[project.scripts]
rr2graph = "rr2graph.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["rr2graph*"]

[tool.black]
target-version = ["py311"]
